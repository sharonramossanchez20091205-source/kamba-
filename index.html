<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban LMS: AI Web Builder</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #EDF2F7; }
        .kanban-column { min-height: 75vh; }
        .overflow-y-auto::-webkit-scrollbar { width: 6px; }
        .overflow-y-auto::-webkit-scrollbar-thumb { background-color: #CBD5E0; border-radius: 3px; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'kanban-bg': '#EDF2F7',
                        'header-bg': '#303F9F',
                        'btn-bg': '#8C9EFF',
                        'card-border': '#E2E8F0'
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col text-slate-900">

    <!-- Header -->
    <header class="bg-header-bg text-white shadow-sm p-5 flex justify-between items-center sticky top-0 z-50">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Kanban LMS: AI Web Builder</h1>
            <p class="text-sm text-indigo-200 font-light mt-0.5">Gestión de Desarrollo y Contenidos</p>
        </div>
        <button onclick="openModal()" class="bg-btn-bg text-header-bg px-6 py-2.5 rounded-lg font-semibold shadow-sm hover:bg-indigo-100 transition text-sm flex items-center gap-2">
            Nueva Tarea
        </button>
    </header>

    <!-- Main Kanban Board -->
    <main class="flex-1 p-6 md:p-8 overflow-x-auto">
        <div id="board" class="grid grid-cols-5 gap-5 min-w-[1200px]">
            
            <!-- Columna Backlog -->
            <div class="bg-white rounded-xl shadow-sm flex flex-col border border-card-border">
                <div class="px-5 py-4 border-b border-card-border flex justify-between items-center">
                    <h2 class="font-semibold text-slate-800 flex items-center gap-2 text-sm">
                        <span class="w-3 h-3 rounded-full bg-slate-500 inline-block"></span>
                        Backlog
                    </h2>
                    <span id="count-Backlog" class="bg-slate-100 text-slate-600 text-xs font-medium px-2.5 py-0.5 rounded-full">0</span>
                </div>
                <div class="flex-1 p-3 flex flex-col gap-3 overflow-y-auto kanban-column" ondragover="allowDrop(event)" ondrop="drop(event, 'Backlog')"></div>
            </div>

            <!-- Columna Asignado a -->
            <div class="bg-white rounded-xl shadow-sm flex flex-col border border-card-border">
                <div class="px-5 py-4 border-b border-card-border flex justify-between items-center">
                    <h2 class="font-semibold text-slate-800 flex items-center gap-2 text-sm">
                        <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                        Asignado a
                    </h2>
                    <span id="count-Asignado-a" class="bg-blue-50 text-blue-600 text-xs font-medium px-2.5 py-0.5 rounded-full">0</span>
                </div>
                <div class="flex-1 p-3 flex flex-col gap-3 overflow-y-auto kanban-column" ondragover="allowDrop(event)" ondrop="drop(event, 'Asignado a')"></div>
            </div>

            <!-- Columna En progreso -->
            <div class="bg-white rounded-xl shadow-sm flex flex-col border border-card-border">
                <div class="px-5 py-4 border-b border-card-border flex justify-between items-center">
                    <h2 class="font-semibold text-slate-800 flex items-center gap-2 text-sm">
                        <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                        En progreso
                    </h2>
                    <span id="count-En-progreso" class="bg-yellow-50 text-yellow-700 text-xs font-medium px-2.5 py-0.5 rounded-full">0</span>
                </div>
                <div class="flex-1 p-3 flex flex-col gap-3 overflow-y-auto kanban-column" ondragover="allowDrop(event)" ondrop="drop(event, 'En progreso')"></div>
            </div>

            <!-- Columna En revisión -->
            <div class="bg-white rounded-xl shadow-sm flex flex-col border border-card-border">
                <div class="px-5 py-4 border-b border-card-border flex justify-between items-center">
                    <h2 class="font-semibold text-slate-800 flex items-center gap-2 text-sm">
                        <span class="w-3 h-3 rounded-full bg-purple-500 inline-block"></span>
                        En revisión
                    </h2>
                    <span id="count-En-revision" class="bg-purple-50 text-purple-700 text-xs font-medium px-2.5 py-0.5 rounded-full">0</span>
                </div>
                <div class="flex-1 p-3 flex flex-col gap-3 overflow-y-auto kanban-column" ondragover="allowDrop(event)" ondrop="drop(event, 'En revisión')"></div>
            </div>

            <!-- Columna Finalizado -->
            <div class="bg-white rounded-xl shadow-sm flex flex-col border border-card-border">
                <div class="px-5 py-4 border-b border-card-border flex justify-between items-center">
                    <h2 class="font-semibold text-slate-800 flex items-center gap-2 text-sm">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                        Finalizado
                    </h2>
                    <span id="count-Finalizado" class="bg-emerald-50 text-emerald-700 text-xs font-medium px-2.5 py-0.5 rounded-full">0</span>
                </div>
                <div class="flex-1 p-3 flex flex-col gap-3 overflow-y-auto kanban-column" ondragover="allowDrop(event)" ondrop="drop(event, 'Finalizado')"></div>
            </div>

        </div>
    </main>

    <!-- Modal para Nueva Tarea -->
    <div id="taskModal" class="fixed inset-0 bg-black/60 hidden justify-center items-center p-4 z-[100]">
        <div class="bg-white rounded-2xl max-w-lg w-full p-7 shadow-2xl">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-xl font-bold text-slate-900">Crear Nueva Tarea</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            
            <form id="taskForm" onsubmit="submitTask(event)" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Título</label>
                    <input type="text" id="title" placeholder="Ej. Diseñar landing page" required class="w-full border border-slate-300 p-2.5 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label>
                    <textarea id="description" placeholder="Detalles de la actividad..." rows="3" class="w-full border border-slate-300 p-2.5 rounded-lg"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Responsable</label>
                        <select id="assignee" class="w-full border border-slate-300 p-2.5 rounded-lg bg-white">
                            <option value="Chelsea">Chelsea</option>
                            <option value="Equipo IA">Equipo IA</option>
                            <option value="Tutor Frontend">Tutor Frontend</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">URL Entregable</label>
                        <input type="url" id="url" placeholder="https://..." class="w-full border border-slate-300 p-2.5 rounded-lg">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Inicio</label>
                        <input type="date" id="startDate" class="w-full border border-slate-300 p-2.5 rounded-lg" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Fin</label>
                        <input type="date" id="endDate" class="w-full border border-slate-300 p-2.5 rounded-lg" required>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-slate-100 text-slate-700 rounded-lg font-semibold text-sm">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 bg-header-bg text-white rounded-lg font-semibold text-sm">Crear Tarea</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzUdiJcb5AOEMk61G1y-bhHHXmvtSkdtgcSnvbSQDa5WLXa1ld_hQnewCaY49JKJ2U7/exec"; // Pega aquí tu URL de Apps Script

        let tasks = [];

        async function fetchTasks() {
            try {
                const response = await fetch(API_URL);
                tasks = await response.json();
                renderBoard();
            } catch (error) {
                console.error("Error al cargar tareas:", error);
            }
        }

        function renderBoard() {
            const columns = document.querySelectorAll('.kanban-column');
            columns.forEach(col => col.innerHTML = '');

            const counts = { 'Backlog': 0, 'Asignado a': 0, 'En progreso': 0, 'En revisión': 0, 'Finalizado': 0 };

            tasks.forEach(task => {
                const statusMap = {
                    'Backlog': 'Backlog',
                    'Asignado a': 'Asignado a',
                    'En progreso': 'En progreso',
                    'En revisión': 'En revisión',
                    'Finalizado': 'Finalizado'
                };
                
                const colWrapper = document.querySelector(`[data-status="${statusMap[task.status]}"]`);
                
                if (colWrapper) {
                    const colBody = colWrapper.querySelector('.kanban-column');
                    counts[statusMap[task.status]]++;

                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-lg shadow-sm border border-slate-100 cursor-grab active:cursor-grabbing flex flex-col gap-2 hover:shadow-md transition-all";
                    card.draggable = true;
                    card.id = task.id;
                    card.ondragstart = (e) => e.dataTransfer.setData('text/plain', task.id);
                    
                    card.innerHTML = `
                        <div class="font-medium text-slate-900 text-sm leading-snug">${task.title}</div>
                        ${task.description ? `<div class="text-xs text-slate-500 line-clamp-2">${task.description}</div>` : ''}
                        <div class="flex items-center justify-between mt-1 pt-2 border-t border-slate-100">
                            <span class="text-[11px] font-medium text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">${task.assignee}</span>
                            <div class="text-[11px] text-slate-400">${task.endDate}</div>
                        </div>
                        ${task.url ? `<a href="${task.url}" target="_blank" class="text-xs text-blue-600 hover:underline truncate">Ver entregable ↗</a>` : ''}
                    `;
                    colBody.appendChild(card);
                }
            });

            document.getElementById('count-Backlog').innerText = counts['Backlog'];
            document.getElementById('count-Asignado-a').innerText = counts['Asignado a'];
            document.getElementById('count-En-progreso').innerText = counts['En progreso'];
            document.getElementById('count-En-revision').innerText = counts['En revisión'];
            document.getElementById('count-Finalizado').innerText = counts['Finalizado'];
        }

        function allowDrop(e) { e.preventDefault(); }

        async function drop(e, newStatus) {
            e.preventDefault();
            const taskId = e.dataTransfer.getData('text/plain');
            const task = tasks.find(t => t.id == taskId);
            if (task && task.status !== newStatus) {
                task.status = newStatus;
                renderBoard();
                await updateTaskInBackend(task);
            }
        }

        async function updateTaskInBackend(task) {
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'updateStatus', id: task.id, status: task.status })
            });
            fetchTasks();
        }

        function openModal() { document.getElementById('taskModal').classList.remove('hidden'); document.getElementById('taskModal').classList.add('flex'); }
        function closeModal() { document.getElementById('taskModal').classList.add('hidden'); document.getElementById('taskModal').classList.remove('flex'); }

        async function submitTask(e) {
            e.preventDefault();
            const newTask = {
                id: Date.now().toString(),
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                assignee: document.getElementById('assignee').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                url: document.getElementById('url').value,
                status: 'Backlog'
            };

            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'createTask', ...newTask })
            });

            closeModal();
            document.getElementById('taskForm').reset();
            fetchTasks();
        }

        fetchTasks();
    </script>
</body>
</html>
