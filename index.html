<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban LMS - Gestor de Tareas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md p-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-wide">Kanban LMS: AI Web Builder</h1>
            <p class="text-xs text-indigo-200">Gestión de Desarrollo y Contenidos</p>
        </div>
        <button onclick="openModal()" class="bg-indigo-500 hover:bg-indigo-600 text-white font-medium px-4 py-2 rounded-lg flex items-center gap-2 shadow transition cursor-pointer">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span>Nueva Tarea</span>
        </button>
    </header>

    <!-- Main Board Container -->
    <main class="p-6 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4" id="kanban-board">
            
            <!-- Columna: Backlog -->
            <div class="bg-slate-200/70 rounded-xl p-4 flex flex-col h-[75vh]" ondragover="allowDrop(event)" ondrop="drop(event, 'Backlog')">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-slate-400"></span> Backlog
                    </h2>
                    <span id="count-Backlog" class="bg-slate-300 text-slate-700 text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 pr-1 kanban-column" id="col-Backlog"></div>
            </div>

            <!-- Columna: Asignado a -->
            <div class="bg-slate-200/70 rounded-xl p-4 flex flex-col h-[75vh]" ondragover="allowDrop(event)" ondrop="drop(event, 'Asignado a')">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-blue-500"></span> Asignado a
                    </h2>
                    <span id="count-Asignado" class="bg-slate-300 text-slate-700 text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 pr-1 kanban-column" id="col-Asignado"></div>
            </div>

            <!-- Columna: En progreso -->
            <div class="bg-slate-200/70 rounded-xl p-4 flex flex-col h-[75vh]" ondragover="allowDrop(event)" ondrop="drop(event, 'En progreso')">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-amber-500"></span> En progreso
                    </h2>
                    <span id="count-Progreso" class="bg-slate-300 text-slate-700 text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 pr-1 kanban-column" id="col-Progreso"></div>
            </div>

            <!-- Columna: En revisión -->
            <div class="bg-slate-200/70 rounded-xl p-4 flex flex-col h-[75vh]" ondragover="allowDrop(event)" ondrop="drop(event, 'En revisión')">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-purple-500"></span> En revisión
                    </h2>
                    <span id="count-Revision" class="bg-slate-300 text-slate-700 text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 pr-1 kanban-column" id="col-Revision"></div>
            </div>

            <!-- Columna: Finalizado -->
            <div class="bg-slate-200/70 rounded-xl p-4 flex flex-col h-[75vh]" ondragover="allowDrop(event)" ondrop="drop(event, 'Finalizado')">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span> Finalizado
                    </h2>
                    <span id="count-Finalizado" class="bg-slate-300 text-slate-700 text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 pr-1 kanban-column" id="col-Finalizado"></div>
            </div>

        </div>
    </main>

    <!-- Modal Nueva Tarea -->
    <div id="taskModal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Crear Nueva Tarea</h2>
            <form id="taskForm" onsubmit="handleCreateTask(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Título</label>
                    <input type="text" id="taskTitle" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Descripción</label>
                    <textarea id="taskDesc" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Responsable</label>
                        <input type="text" id="taskAssignee" value="Chelsea" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">URL de Entregable</label>
                        <input type="url" id="taskUrl" placeholder="https://..." class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha Inicio</label>
                        <input type="date" id="taskStart" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha Fin</label>
                        <input type="date" id="taskEnd" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg cursor-pointer">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow cursor-pointer">Guardar Tarea</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Lógica y Sincronización -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxaz-1E-6sdgGs4yrtVyUEf8POc6TeodsOlW2ueGSeirbIUsuJqU3xZ-58JgyVNJdqy/exec";

        let tasks = [];

        async function fetchTasks() {
            try {
                const response = await fetch(API_URL);
                tasks = await response.json();
                renderBoard();
            } catch (error) {
                console.error("Error al cargar tareas:", error);
            }
        }

        function renderBoard() {
            const columns = {
                'Backlog': document.getElementById('col-Backlog'),
                'Asignado a': document.getElementById('col-Asignado'),
                'En progreso': document.getElementById('col-Progreso'),
                'En revisión': document.getElementById('col-Revision'),
                'Finalizado': document.getElementById('col-Finalizado')
            };

            const counts = { 'Backlog': 0, 'Asignado a': 0, 'En progreso': 0, 'En revisión': 0, 'Finalizado': 0 };

            Object.values(columns).forEach(col => col.innerHTML = '');

            tasks.forEach(task => {
                const status = task.status || 'Backlog';
                if (counts[status] !== undefined) counts[status]++;

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 cursor-move hover:shadow-md transition";
                card.draggable = true;
                card.ondragstart = (e) => e.dataTransfer.setData('text/plain', task.id);

                card.innerHTML = `
                    <h3 class="font-bold text-slate-800 text-sm mb-1">${task.title}</h3>
                    <p class="text-xs text-slate-500 mb-3">${task.description || 'Sin descripción'}</p>
                    <div class="flex justify-between items-center text-[11px] text-slate-400 border-t pt-2">
                        <span class="bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded font-medium">${task.assignee}</span>
                        <span>${task.endDate || ''}</span>
                    </div>
                `;

                if (columns[status]) {
                    columns[status].appendChild(card);
                }
            });

            document.getElementById('count-Backlog').innerText = counts['Backlog'];
            document.getElementById('count-Asignado').innerText = counts['Asignado a'];
            document.getElementById('count-Progreso').innerText = counts['En progreso'];
            document.getElementById('count-Revision').innerText = counts['En revisión'];
            document.getElementById('count-Finalizado').innerText = counts['Finalizado'];
        }

        function allowDrop(e) { e.preventDefault(); }

        async function drop(e, newStatus) {
            e.preventDefault();
            const taskId = e.dataTransfer.getData('text/plain');
            
            const task = tasks.find(t => t.id.toString() === taskId.toString());
            if (task && task.status !== newStatus) {
                task.status = newStatus;
                renderBoard();

                const params = new URLSearchParams({
                    action: 'updateStatus',
                    id: taskId,
                    status: newStatus
                });

                try {
                    await fetch(`${API_URL}?${params.toString()}`);
                } catch (error) {
                    console.error("Error al actualizar estado:", error);
                }
            }
        }

        async function handleCreateTask(e) {
            e.preventDefault();
            
            const params = new URLSearchParams({
                action: 'createTask',
                id: Date.now().toString(),
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDesc').value,
                assignee: document.getElementById('taskAssignee').value,
                startDate: document.getElementById('taskStart').value,
                endDate: document.getElementById('taskEnd').value,
                url: document.getElementById('taskUrl').value,
                status: 'Backlog'
            });

            closeModal();
            document.getElementById('taskForm').reset();

            try {
                // Envía la petición limpiamente por GET a Google Sheets
                await fetch(`${API_URL}?${params.toString()}`);
                
                // Recargamos el tablero de inmediato para traer la tarea sincronizada
                setTimeout(fetchTasks, 1000);
            } catch (error) {
                console.error("Error al crear tarea:", error);
            }
        }

        function openModal() { document.getElementById('taskModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('taskModal').classList.add('hidden'); }

        window.onload = () => {
            lucide.createIcons();
            fetchTasks();
        };
    </script>
</body>
</html>
